te\":[\"$\",\"$L4\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}]\n13:T25a2,"])</script><script>self.__next_f.push([1,"\n# Rule Text Processing in Linux using Grep, Sed, and Awk\n\nAre you a Linux user? Not a lover? 🫣 Are you fully exploring the power of your Linux system? At the end of this article you'll be!\n\nTherefore, it's inevitable to learn some important utilities we often use for text processing in Linux such as \"grep\", \"sed\" and \"awk\". This article will introduce these tools, highlight their key use cases, and provide practical examples to solve common Linux text processing challenges.\n\nLet's jump into the segment without wasting time…\n\n## Grep\n\nThe name \"grep\" stands for Global Regular Expression Print, and it's a command line utility in Linux and it's a powerful tool also. Grep stands out as one of the most versatile and essential tool for any Linux user specially if you're gonna perform data searching and extraction from different data types. It's an old Unix utility and released nearly 50 years ago since 2024. You don't need to install this tool. It's pre-installed in Linux. It allows searching for matches to certain text patterns (regular expressions) in files.\n\n```bash\n# Get help\ngrep -h\n```\n\nGrep is used for a wide range of text processing tasks, including:\n\n- Searching for specific text patterns in files\n- Filtering outputs of other commands\n- Extracting useful information from log files\n- Analyzing large datasets\n\n### Basic Syntax:\n```bash\ngrep [options] pattern [file_name]\n```\n\nIf file name is not provided then \"grep\" will take standard input from the shell environment.\n\n### Use Cases\n\nMainly it can be used for searching plain text data for lines that match a regular expression.\n\nNote that Grep tool is case sensitive.\n\nLet's try the below command…\n\n```bash\necho \"Hello World!\" | grep \"World\"\n```\n\n**Output:**\n```\nHello World!\n```\n\nIn the above command, grep takes standard input and processing it to match for the \"World\" text and it prints the entire line of text. Therefore, need to look at the default behavior of the Grep command, it searches for the pattern match throughout the inputted text and if it finds a match then it prints the entire line that contains the word we're searching for.\n\nLet's try for a text file that contains following data.\n\n**File Name: myfile.txt**\n\n```plain-text\nFile Name: myfile.txt\nCreated At: August 5, 2024\nUpdated At: August 9, 2024\nSecure: True\n```\n\n```bash\ncat myfile.txt | grep \"Name\"\n```\n\n**Output:**\n```plain-text\nFile Name: myfile.txt\n```\n\n**Also we can run like the below if we're in the input file directory:**\n```bash\ngrep \"Name\" myfile.txt\n```\n\n**Or need to provide an absolute path of the input file:**\n```bash\ngrep \"Name\" /home/santhos/Desktop/myfile.txt\n```\n\nNow you know that Grep tool finds the specified text in the input stream and prints the entire line if there's a match.\n\nNow, let's update the \"myfile.txt\" file and try to get the same text we tried to get before.\n\n**File Name: myfile.txt**\n\n```plain-text\nFile Name: myfile.txt\nCreated At: August 5, 2024\nUpdated At: August 9, 2024\nSecure: True\n\nAuthor Name: Santhos Sunthar\nFunction name: UtilityTest\n```\n\nSo, now we could see the output like below…\n\n```bash\ncat myfile.txt | grep \"Name\"\n```\n\n**Output:**\n```plain-text\nFile Name: myfile.txt\nAuthor Name: Santhos Sunthar\n```\n\nTherefore, now you could get an idea about the basic function of this tool and the output pattern.\n\nLet's do something differently!\n\n```bash\ncat myfile.txt | grep -i \"Name\"\n```\n\n**Output:**\n```plain-text\nFile Name: myfile.txt\nAuthor Name: Santhos Sunthar\nFunction name: UtilityTest\n```\n\nHave you noticed the difference between the previous command and the last one? We've added \"-i\" attribute to tell grep to perform case insensitive search right. Therefore, we could get results for \"Name\" and \"name\" keywords.\n\nHow can we get line numbers of the word we search in the specified txt file? We need to add an another attribute \"-n\" to get line numbers.\n\n```bash\ncat myfile.txt | grep -i -n \"Name\"\n```\n\n**Output:**\n```plain-text\n3:File Name: myfile.txt\n9:Author Name: Santhos Sunthar\n10:Function name: UtilityTest\n```\n\n## Sed\n\n\"sed\" stands for \"Stream Editor.\" It's used for parsing and transforming text in a data stream or a file using a simple and compact programming language.\n\n### Use Cases\n- Substitute text in a file\n- Remove lines or text patterns\n- Insert text at specific locations\n\n```bash\n# Get help\nsed -h\n```\n\nIt's a powerful and handy tool to substitute text.\n\n```bash\necho \"Hello World!\" | sed s/World/Folks/\n```\n\n**Output:**\n```plain-text\nHello Folks!\n```\n\nWhat will happen for the below command execution?\n\n```bash\necho \"Hello World! Ah, add another World...\" | sed s/World/Folks/\n```\n\n**Output:**\n```plain-text\nHello Folks! Ah, add another World\n```\n\nAs you could see, only the first value of \"World\" was being substituted but not the second one. Therefore, if we need to substitute all the occurrences of the input data then we have to execute the command like below…\n\n```bash\necho \"Hello World! Ah, add another World...\" | sed s/World/Folks/g\n```\n\n**Output:**\n```plain-text\nHello Folks! Ah, add another Folks\n```\n\nWe can substitute text in our myfile.txt too!\n\n```bash\nsed s/name/Name/g myfile.txt\n```\n\n**Output:**\n```plain-text\n# myfile.txt\n\nFile Name: myfile.txt\nCreated At: August 5, 2024\nUpdated At: August 9, 2024\nSecure: True\n\nAuthor Name: Santhos Sunthar\nFunction Name: UtilityTest\n```\n\nHow can we remove the first line that starts with \"#\" from our myfile.txt?\n\n```bash\nsed /^#/d myfile.txt\n```\n\n**Output:**\n```plain-text\nFile Name: myfile.txt\nCreated At: August 5, 2024\nUpdated At: August 9, 2024\nSecure: True\n\nAuthor Name: Santhos Sunthar\nFunction name: UtilityTest\n```\n\nIn the above command execution, all the comments that contains \"#\" were removed in the \"myfile.txt\".\n\nLet's insert a new line in the second line of myfile.txt…\n\n```bash\nsed '2i\\# Configuration File' myfile.txt\n```\n\n**Output:**\n```plain-text\n# myfile.txt\n# Configuration File\nFile Name: myfile.txt\nCreated At: August 5, 2024\nUpdated At: August 9, 2024\nSecure: True\n\nAuthor Name: Santhos Sunthar\nFunction name: UtilityTest\n```\n\nAlso, we can remove blank lines from the myfile.txt.\n\n```bash\nsed /^$/d myfile.txt\n```\n\n**Output:**\n```plain-text\n# myfile.txt\nFile Name: myfile.txt\nCreated At: August 5, 2024\nUpdated At: August 9, 2024\nSecure: True\nAuthor Name: Santhos Sunthar\nFunction name: UtilityTest\n```\n\nNow If we have multiple files, So how can we substitute text in those all files at once? Let's try this command…\n\n```bash\nsed s/anything/special/g *.txt\n```\n\n## Awk\n\n\"awk\" is a powerful programming language designed for text processing, and It is typically used as a data extraction and reporting tool.\n\n### Use Cases\n- Select specific fields from structured text files\n- Perform complex text transformations\n- Summarize data from files\n\nLet's print the first column of myfile.txt.\n\n```bash\nawk '{print $1}' myfile.txt\n```\n\n**Output:**\n```plain-text\n#\nFile\nCreated\nUpdated\nSecure:\nAuthor\nFunction\n```\n\nLet's print the third column of myfile.txt.\n\n```bash\nawk '{print $3}' myfile.txt\n```\n\n**Output:**\n```plain-text\nmyfile.txt\nAugust\nAugust\n\nSanthos\nUtilityTest\n```\n\nNow you could have an idea on the \"awk\" command and its text processing function. It goes through all lines one by one and treats spaces as a default delimiter to split a line of text and find the word which is placed in the specified number in the command. For an example, the tool splits the line and find the word in third occurrence in the last command execution.\n\nCan we count the number of lines that starts with \"#\" in the myfile.txt?\n\n```bash\nawk '/#/{count++}END{print count}' myfile.txt\n```\n\n**Output:**\n```plain-text\n1\n```\n\nAbove output shows that the myfile.txt only contains a commented line that's \"# myfile.txt\".\n\nLet's filter the \"Author Name\" and \"Function Name\"…\n\n```bash\nawk -F: '/Author Name|Function name/{print $2}' myfile.txt\n```\n\n**Output:**\n```plain-text\nSanthos Sunthar\nGrepTest\n```\n\nWe can format it in a good way!\n\n```bash\nawk -F': ' '/Author Name|Function name/ {printf \"%s: %s\\n\", $1, $2}' myfile.txt\n```\n\n**Output:**\n```plain-text\nAuthor Name: Santhos Sunthar\nFunction name: GrepTest\n```\n\nLet's extract the timeline information of myfile.txt…\n\n```bash\nawk -F': ' '/Created At|Updated At/{print $2}' myfile.txt\n```\n\n**Output:**\n```plain-text\nAugust 5, 2024\nAugust 9, 2024\n```\n\nLet's check whether the myfile.txt is secure or not…\n\n```bash\nawk -F: '/Secure/{if($2~/True/) print \"myfile.txt is secure\"; else print \"myfile.txt is not secure\"}' myfile.txt\n```\n\n**Output:**\n```plain-text\nmyfile.txt is secure\n```\n\nYou learnt these commands now to explore text processing in Linux!\n\nLet's explore the benefits of pipelining these commands…\n\nI'm gonna extract timeline information to modify it. So, let's change the month \"August\" to \"July\".\n\n```bash\ngrep 'At:' myfile.txt | sed 's/August 9/August 10/' | awk -F': ' '{print $2}'\n```\n\n**Output:**\n```plain-text\nAugust 5, 2024\nAugust 10, 2024\n```\n\nLet's format the output data nicely using \"awk\" and \"sed\".\n\n```bash\nawk -F': ' '/File Name|Author Name|Secure/ {print $1 \": \" $2}' myfile.txt | sed 's/^/-\u003e /'\n```\n\n**Output:**\n```plain-text\n-\u003e File Name: myfile.txt\n-\u003e Secure: True\n-\u003e Author Name: Santhos Sunthar\n```\n\nBy combining \"grep\", \"sed\" and \"awk\", you can create powerful and flexible scripts to handle complex text processing tasks in Linux.\n\n## Conclusion\n\nI hope you liked this article, and mastering in \"grep\", \"sed\" and \"awk\" can significantly enhance your ability to process and analyze text data in Linux systems. Therefore, why are you waiting to make your hands dirty? Let's practice these amazing utilities in your favorite Linux distro! 🙂"])</script><script>self.__next_f.push([1,"14:T1b65,"])</script><script>self.__next_f.push([1,"\n# Batch File Processing in Linux\n\nWe are going to see how batch file processing makes your life easier with any Unix like operating systems including Linux when it comes to deal with files and directories.\n\nSo, Let's get started…\n\n## Find Utility\n\n\"find\" is used to search any files or directories in your Linux machine. Let's see how we can do that effectively for our own needs!\n\nYour questions would be like these…\n\n- How can I find a file using its name?\n- How can I find a directory using its name?\n- How can I find a file using its extension?\n- How can I find a file using its size?\n\nTherefore, we can use \"find\" command to solve those questions!\n\nFirst of all, we should know the common syntax of the \"find\" command.\n\n```bash\nroot@host:~$ find [path] [expression1] [expression2] [expression3]\n```\n\nNow, we can use the above command pattern to fulfill our batch file processing needs!\n\n### Finding a File using Its Name\n\nTo find a file using its name, we should know the specific filename and the path that file exists.\n\n```bash\nroot@host:~$ find /etc -name \"passwd\"\n```\n\nThe above command finds all files with the name \"passwd\".\n\nWhat will happen if we do not provide \"path\" parameter in \"find\" command? It will automatically set the current working directory as the path and It will try to find the file from the current working directory file index.\n\nThe above command only looks files without the concern of extensions. It will not find \"passwd.txt\" file. If we want to include extensions in our search then we have to use the following command…\n\n```bash\nroot@host:~$ find /etc -name \"passwd*\"\n```\n\nThe \"passwd*\" pattern matches files whose names begin with \"passwd\" including extension.\n\n### Finding a Directory using Its Name\n\nTo find a directory using its name, we should know the directory name and the specific path that the directory exists. Also, we should provide a parameter called \"type\" as \"d\".\n\n```bash\nroot@host:~$ find /var -name \"www\" -type d\n```\n\nThe above command finds the specified \"www\" directory within \"/usr\" directory path.\n\n### Finding a File using Its Extension\n\nTo find a file using its extension, we should provide the following command.\n\n```bash\nroot@host:~$ find /var/www -name \"*.html\"\n```\n\nThe above command finds all the \"html\" files within \"/var/www\" directory path. \"*\" is a placeholder that represents all the filenames.\n\n### Finding a File using Its Size\n\nTo find a file using its size, we should provide another parameter called \"size\".\n\n```bash\nroot@host:~$ find /var/www -name \"*.png\" -size +1M\n```\n\nThe above command finds all \"png\" files within the specified directory path whose size is greater than \"1 Megabyte (1M)\".\n\n## Use Case of Find Utility\n\nThink that you are currently working on a directory that contains lot of \"txt\" files. Now, you should need to convert all of the \"txt\" files into \"json\" files. How can you solve this problem without changing each file manually by editing each file's extension from \".txt\" to \".json\"?\n\nNow, we can use \"find\" command to solve this problem by automating all the tasks using a \"Bash\" script.\n\n```bash\n#!/bin/bash\n\nfor i in `find -name \"*.txt\"`; do\n  \"$i\" \u003e \"${i%.*}.json\";\ndone\n```\n\nThe above script contains a \"for\" loop that iterates over each file name and new file will be created with \".json\" extension in each iteration.\n\n## Xargs Utility\n\n\"xargs\" is used to execute multiple commands by passing arguments from the input stream.\n\nFor an example, if we want to pass 100 arguments to the \"touch\" command to create 100 \".txt\" files then \"xargs\" command will help us.\n\nLet's see this scenario…\n\nWe have a file named as \"backup.txt\" and that file contains following data.\n\n```plain-text\n2024-01_backup-01\n2024-01_backup-02\n2024-01_backup-03\n2024-01_backup-04\n2024-01_backup-05\n...\n...\n...\n2024-01_backup-100\n```\n\nThe task is…\n\nWe have to create \"txt\" files that should be named in \"2024–01_backup-[number]\" pattern. Shall we do it manually by using touch command by specifying each filename like this?\n\n```bash\nroot@host:~$ touch 2024-01_backup-01 2024-01_backup-02 2024-01_backup-03 ... 2024-01_backup-100\n```\n\nBoring!\n\nThen how we can solve this problem efficiently? \"xargs\" comes into play in these kind of scenarios!\n\nLet's see how we can do this by using \"xargs\" command…\n\n```bash\nroot@host:~$ cat backup.txt | xargs touch\n```\n\nThe above simple command creates 100 \"txt\" files named as its own from the \"backup.txt\" file data as inputs.\n\nTo view the newly created files, use \"ls\" command.\n\n```bash\nroot@host:~$ ls\n2024-01_backup-01 2024-01_backup-02 2024-01_backup-03 2024-01_backup-04\n2024-01_backup-05 2024-01_backup-06 ... 2024-01_backup-99 2024-01_backup-100\n```\n\nWhere is \".txt\" extension of all of the newly created files? To add an extension, we should customize our \"xargs\" command.\n\n```bash\nroot@host:~$ cat backup.txt | xargs -i touch {}.txt\n```\n\nThe above command prints the data of the \"backup.txt\" file and \"xargs\" command gets the all printed output and each line will be passed as an argument to the \"touch\" command through the \"{}\" placeholder.\n\nIf we want to use custom placeholder instead of \"{}\" then we have to use \"-I\" instead of \"-i\" parameter.\n\n```bash\nroot@host:~$ cat backup.txt | xargs -I arg_name touch arg_name.txt\n```\n\nHow we can pass number of arguments into a command? For this, we should specify how many arguments should be passed into a command when a single command execution happens by using \"-n\" parameter.\n\nFor an example, we have a \"txt\" file named as \"data.txt\" that contains following data.\n\n```plain-text\nFood=Rice Fruit=Banana Drink=Milk\n```\n\nNow, we can print each pair of data in newline from the above \"data.txt\" with the help of \"xargs\" command by passing number of arguments.\n\n```bash\nroot@host:~$ cat data.txt | xargs -n 1 echo\nFood = Rice\nFruit = Banana\nDrink = Milk\n```\n\nWhat will happen, if we give 2 arguments…\n\n```bash\nroot@host:~$ cat data.txt | xargs -n 2 echo\nFood=Rice Fruit=Banana\nDrink=Milk\n```\n\nLike this, we can control the number of arguments before passing into any commands.\n\n## Use Case of Xargs Utility\n\nWe have \"filenames.txt\" file that contains the following data…\n\n```plain-text\npasswd\nsecrets\nadmin\nindex\n```\n\nOur current working directory listing is…\n\n```bash\nroot@host:~$ ls\nadmin.php  filenames.txt  secrets.json\n```\n\nTask is…\n\nWe have to find files whether files exist or not in the current working directory.\n\nTo solve this task, we can use \"xargs\" command…\n\n```bash\nroot@host:~$ cat filenames.txt | xargs -I file_name sh -c 'find -name \"file_name*\"'\n./secrets.json\n./admin.php\n```\n\nThe above commands find files from the current directory by using \"filenames.txt\" data. \"sh -c\" executes the \"find\" command for each filename separately.\n\n## Conclusion\n\nThat's all about this reading and It's time to end! I hope this article will be helpful to accomplish your batch file processing activities! Thank you for putting your eyesight and five minutes on this article. I'll see you again with my future post! 😊"])</script><script>self.__next_f.push([1,"15:T252a,"])</script><script>self.__next_f.push([1,"\n# Introduction\n\nWhy Bash? Do you know that you can automate your most of the daily tasks by using Bash scripting! Sequence of commands can be automated and perform repeatedly. Bash is a Unix shell and command language written by Brian Fox and first released in 1989.\n\n## Creating Bash Files\n\n`.sh` extension is used to create Bash files. We can create Bash files manually or using touch or nano commands in Linux system.\n\n```bash\nroot@host:~$ nano my_bash_file.sh\n```\n\nThe above command will create a bash file name called \"my_bash_file\" with the extension \".sh\".\n\n## Simple Hello World Script\n\nIn the Linux terminal whatever commands we execute to do any task can be recorded into a Bash file and all the recorded tasks can be executed by using a single command in the Terminal.\n\nWhen we create Bash files, we often define the file belongs to Bash file by defining shebang `#!/bin/bash` at the first line of the file.\n\nLet's create hello_world.sh file:\n\n```bash\nroot@host:~$ nano hello_world.sh\n```\n\nWrite a command to print \"Hello World!\":\n\n```bash\n#!/bin/bash\n\necho \"Hello World!\"\n```\n\nWe can execute the above script after saving the file using \"bash\" command:\n\n```bash\nroot@host:~$ bash hello_world.sh\n```\n\nIf we make the file executable then we can execute the script by using \"./\" and your file name as postfix. To make the file as executable, we should set permission to execute the program. To set permissions for a file, we can use \"chmod\" command:\n\n```bash\nroot@host:~$ chmod +x hello_world.sh\n```\n\nThe above command sets executable permission to the specified file. \"chmod\" is used to change the permissions and \"+x\" adds the execute permission. If you need to remove the permission then use \"-x\". \"+\" for adding permission and \"-\" for removing permission of a file.\n\nNow we can execute our bash script file by putting \"./\" at the start of the file name:\n\n```bash\nroot@host:~$ ./hello_world.sh\n```\n\nAbove both commands will execute our script file to perform the specified tasks.\n\n## Passing Arguments to a Script\n\nWhile performing some certain tasks, our script often need some arguments from the user input. Therefore, arguments can be passed to a script while its execution and passed values can be captured by using \"$\" sign with the arguments passed order.\n\n```bash\n#!/bin/bash\n\necho $1 $2\n```\n\nAbove statement's `$1` represents the first argument and `$2` represents the second argument to be passed.\n\n```bash\nroot@host:~$ ./hello_world.sh \"Hello\" \"World\"\n```\n\nIf we see the above command line, `$1` represents \"Hello\" and `$2` represents \"World\" and the program output will be \"Hello World\".\n\n\n## Variables\n\nVariables are not strictly typed in Bash means if we provide a value to a variable then bash will understand and interpret the corresponding data type of that value. Just use meaningful names when you define and initialize variables. Variable can contain letters, underscores and numbers but it cannot start with a number and it is case sensitive.\n\n```bash\n#!/bin/bash\n\nfirstName=\"Santhos\"\nlastName=\"Sunthar\"\nage=24\n```\n\nMake sure that you do not include spaces between the variable name and specified value otherwise you will end up with \"command not found error\".\n\n```bash\n#!/bin/bash\n\nfirstName = \"Santhos\"  # Wrong\nfirstName=\"Santhos\"    # Correct\n```\n\nWhen we access the variable in any place within the file, we should use \"$\" sign to access the variable's specified value.\n\n```bash\n#!/bin/bash\n\nfirstName=\"Santhos\"\n\necho $firstName  # Output \u003e\u003e\u003e Santhos\n```\n\n### Variable Scope\n\n#### Global Scope\n\nGlobal variable is defined and accessible throughout the entire script. It can be accessed from the function and also outside of the function.\n\n```bash\n#!/bin/bash\n\nvariable=\"I am global and I can be accessed from anywhere!\"\n\nfunction testVariable() {\n  echo \"Accessed from the function: $variable\"\n}\n\ntestVariable\necho \"Accessed from outside of the function: $variable\"\n```\n\n#### Local Scope\n\nVariable which is defined within a function using \"local\" keyword and it is only accessible within the function. It will not affect the global variable which contains same name as the local variable.\n\n```bash\n#!/bin/bash\n\nvariable=\"I am global and I can be accessed from anywhere!\"\n\nfunction testVariable() {\n  local variable=\"I am local and I am only accessible within the function!\"\n  echo \"Accessed from the function: $variable\"\n}\n\ntestVariable\necho \"Accessed from outside of the function: $variable\"\n```\n\nIf you do not define the local variable within the function using \"local\" keyword then the variable will be treated as a global variable and the value of the variable will be modified.\n\n\n## String Concatenation\n\nWe can concatenate multiple strings to produce a new string.\n\n```bash\n#!/bin/bash\n\nfirstName=\"Santhos\"\nlastName=\"Sunthar\"\nage=24\n\nfullName=\"$firstName $lastName\"  \n\necho $fullName  # Output \u003e\u003e\u003e Santhos Sunthar\n```\n\n## Arithmetic Operators\n\nArithmetic operators are useful when performing addition, subtraction, multiplication, division and etc.\n\n- `(+)` - Addition\n- `(-)` - Subtraction\n- `(*)` - Multiplication\n- `(/)` - Division\n- `(%)` - Modulus (To get the reminder of division)\n- `(**)` - Exponentiation\n- `(++)` - Increment\n- `(--)` - Decrement\n- `(=)` - Assignment\n\nArithmetic operations should be performed within double open and close parenthesizes.\n\n```bash\n#!/bin/bash\n\nnumber=5\n\nsquare=$(($number ** 2))\necho $square  # Output \u003e\u003e\u003e 25\n```\n\nWhen writing expressions be aware that we cannot use spaces between the variable name and the equal sign.\n\n```bash\n#!/bash\n\nsum = $((100 + 200))  # Wrong\nsum=$((100 + 200))    # Correct\n```\n\nWhen you have a string that contains a variable name, \"let\" keyword can be used to access the specific variable's value by using the variable name.\n\n```bash\n#!/bin/bash\n\nlet \"sum = 100 + 200\"\necho $sum  # Output \u003e\u003e\u003e 300\n```\n\nYou can see that the above command \"sum = 100 + 200\" does not contain parenthesizes and it can contain spaces between the variable name and specified values.\n\n\n\n## Conditional Operators\n\nConditional operators are useful when we need to make decisions. We can achieve this by using if, elif and else statements.\n\nBefore moving into the statements we should know the comparison operators which are used to compare values in bash to make decisions.\n\n### Comparison Operators\n\n- `-gt`: Greater than\n- `-ge`: Greater than or equal\n- `-lt`: Less than\n- `-le`: Less than or equal\n- `-eq`: Equal\n- `-ne`: Not equal\n\n### if Statement\n\n```bash\n#!/bin/bash\n\nif [ $age -ge 21 ]; then\n  echo \"You are eligible!\"\nfi\n```\n\nDid you see the \"fi\" keyword at the end of the if statement. \"fi\" is used to terminate the if statement which is the reversed form of \"if\" keyword.\n\n### if and else Statements\n\n```bash\n#!/bin/bash\n\nif [ $age -ge 21 ]; then\n  echo \"You are eligible!\"\nelse\n  echo \"You are not eligible!\"\nfi \n```\n\n### if and elif Statements\n\n```bash\n#!/bin/bash\n\nif [ $marks -ge 75 ]; then\n  echo \"You are doing well!\"\nelif [ $marks -ge 50 ]; then\n  echo \"You can improve than this!\"\nelse\n  echo \"Poor performance!\"\nfi\n```\n\n\n\n## Iterators\n\nIterations can be performed using loops such as while loop, for loop and until loop.\n\n### for Loop\n\nWhen we know how many times the task should be iterated.\n\n```bash\n#!/bin/bash\n\nfor ((initialization; condition; increment)); do\n  # Some Code\ndone\n```\n\n**For an example:**\n\n```bash\nfor ((number=1; number\u003c=5; number++)); do\n  echo $number\ndone\n```\n\n### while Loop\n\nIterations happen till the certain condition is true.\n\n```bash\n#!/bin/bash\n\nwhile [ condition ]; do\n  # Some Code\ndone\n```\n\n**For an example:**\n\n```bash\nprocessId=10\nwhile [ $processId -ge 1 ]; do\n    echo \"Process $processId is running!\"\n    ((processId--))\ndone\n\necho \"Processes executed successfully!\"\n```\n\n### until Loop\n\nIterations happen till the certain condition is false.\n\n```bash\n#!/bin/bash\n\nuntil [ condition ]; do\n    # Some Code\ndone\n```\n\n**For an example:**\n\n```bash\nprocessId=1\nuntil [ $processId -ge 10 ]; do\n    echo \"Loading...\"\n    ((processId++))\n    sleep 1\ndone\n\necho \"Loaded successfully!\"\n```\n\nYou can see the \"sleep\" keyword in the until loop statement which is used to make the iteration delay by one second.\n\n\n\n## Functions\n\nFunctions are useful when you need to reuse some piece of code. Once define and call multiple time purposes!\n\n### Function Definition and Call\n\nWe can define the function using \"function\" keyword with the function name and can write codes within curly braces. Function can be called by using its name.\n\n```bash\n#!/bin/bash\n\nfunction print() {\n    echo \"Program loaded successfully!\"\n}\n\nprint  # Output \u003e\u003e\u003e Program loaded successfully!\n```\n\n### Parameters and Arguments\n\nArguments can be passed as sequences of values with spaces and the passes values can be captured within the function using \"$\" sign with the number order that refers the argument values passed order.\n\n```bash\n#!/bin/bash\n\nfunction print() {\n    echo \"$1 $2\"\n}\n\nprint \"Hello\" \"World\"  # Output \u003e\u003e\u003e Hello World\n```\n\nNote that when we use \"echo\" command within a function, it returns the value as a function output.\n\nIf we want to capture the return value of the function, we should use parenthesizes.\n\n```bash\n#!/bin/bash\n\nfunction print() {\n    echo \"$1 $2\"\n}\n\nfunctionOutput=$(print \"Hello\" \"World\")\necho $functionOutput  # Output \u003e\u003e\u003e Hello World\n```\n\n## Conclusion\n\nThat's all in this reading and I hope this article will be helpful to accomplish your automation tasks! Thank you for putting your eyesight and six minutes on this article. I'll see you again with my future post! 😊"])</script><script>self.__next_f.push([1,"e:[\"$\",\"$1\",\"c\",{\"children\":[[\"$\",\"$11\",null,{\"fallback\":[\"$\",\"div\",null,{\"className\":\"min-h-screen bg-black flex items-center justify-center\",\"children\":[\"$\",\"div\",null,{\"className\":\"animate-spin rounded-full h-8 w-8 border-b-2 border-white\"}]}],\"children\":[\"$\",\"$L12\",null,{\"posts\":[{\"id\":\"rule-text-processing-in-linux\",\"shortId\":\"rule-text-processing-in-linux-2833dc82\",\"title\":\"Rule Text Processing in Linux using Grep, Sed, and Awk\",\"date\":\"2024-11-19\",\"category\":\"Linux\",\"tags\":[\"Linux\",\"Command Line\",\"Text Processing\",\"Grep\",\"Sed\",\"Awk\"],\"readTime\":\"6 min read\",\"author\":\"Santhos Suntharalingam\",\"featured\":true,\"content\":\"$13\",\"excerpt\":\"Master the essential Linux text processing utilities - grep, sed, and awk. Learn how to search, filter, and transform text data efficiently with practical examples and real-world use cases.\"},{\"id\":\"batch-file-processing-in-linux\",\"shortId\":\"batch-file-processing-in-linux-66e38aaf\",\"title\":\"Batch File Processing in Linux\",\"date\":\"2024-01-24\",\"category\":\"Linux\",\"tags\":[\"Linux\",\"Command Line\",\"Automation\",\"File Management\"],\"readTime\":\"5 min read\",\"author\":\"Santhos Suntharalingam\",\"featured\":true,\"content\":\"$14\",\"excerpt\":\"Learn how to efficiently process files in batches using Linux command-line tools like find and xargs for automation and file management tasks.\"},{\"id\":\"bash-scripting-basics\",\"shortId\":\"bash-scripting-basics-0f57f216\",\"title\":\"Bash Scripting Basics\",\"date\":\"2024-01-04\",\"category\":\"Security\",\"tags\":[\"Bash\",\"Linux\",\"Security\",\"Automation\",\"Scripting\"],\"readTime\":\"6 min read\",\"author\":\"Santhos Suntharalingam\",\"featured\":true,\"content\":\"$15\",\"excerpt\":\"Learn the fundamentals of Bash scripting for automation and system administration. This
